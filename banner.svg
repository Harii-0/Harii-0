<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hello, I'm Hari! I am an AIML Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#12263F"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <path d="M0 205 Q125.0 179 250.0 205 T500.0 205 T750.0 205 T1000.0 205 T1250.0 205 T1500.0 205 T1750.0 205 T2000.0 205 L2000.0 300 L0 300 Z" fill="#2B5C8A" fill-opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 222 Q125.0 202 250.0 222 T500.0 222 T750.0 222 T1000.0 222 T1250.0 222 T1500.0 222 T1750.0 222 T2000.0 222 L2000.0 300 L0 300 Z" fill="#0B0F14" fill-opacity="0.55">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-70 0; 70 0; -70 0" keyTimes="0; 0.5; 1" calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>
      <text x="500.0" y="115" text-anchor="middle" fill="#FFFFFF"
            font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
            font-size="58" font-weight="700" letter-spacing="1">Hello, I'm Hari!</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="70 0; -70 0; 70 0" keyTimes="0; 0.5; 1" calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>
      <rect x="440.0" y="136" width="120" height="4" rx="2" fill="url(#accent)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="70 0; -70 0; 70 0" keyTimes="0; 0.5; 1" calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>
      <text x="500.0" y="182" text-anchor="middle" fill="#9FC5E8"
            font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
            font-size="25" font-weight="600" letter-spacing="2">I am an AIML Enthusiast</text>
    </g>
  </g>
</svg>
